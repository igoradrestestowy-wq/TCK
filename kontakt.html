<!DOCTYPE html>
<html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kontakt - Terapia Czaszkowo-Krzyżowa Gdynia</title>
<style>
:root{--primary:#4A6B6C;--secondary:#8FA89B;--dark:#2F3E3F;--light:#F4F7F5;--accent:#D7A98C;--white:#fff}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;line-height:1.6;color:var(--dark);background:var(--light);display:flex;flex-direction:column;min-height:100vh}header{background:var(--white);box-shadow:0 2px 10px rgba(0,0,0,.05);position:sticky;top:0;z-index:1000}.nav-container{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:20px}.logo{font-weight:bold;font-size:1.2rem;color:var(--primary);text-decoration:none}nav{display:flex;align-items:center;gap:12px}nav a{color:var(--dark);text-decoration:none;font-size:.95rem;transition:color .3s}nav a:hover,nav a.active{color:var(--primary);font-weight:bold}.menu-toggle{display:none;width:44px;height:44px;border:0;border-radius:8px;background:transparent;cursor:pointer}.menu-toggle span{display:block;width:26px;height:3px;margin:5px auto;border-radius:2px;background:var(--primary);transition:.25s}.section{padding:60px 20px;max-width:1200px;margin:0 auto;width:100%}.section h2{font-size:2rem;color:var(--primary);margin-bottom:30px;text-align:center}.section h2:after{content:'';display:block;width:50px;height:3px;background:var(--accent);margin:10px auto 0}.card{background:var(--white);padding:30px;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,.03)}.contact-info{text-align:center;font-size:1.1rem}.contact-info img{max-width:100%;height:auto;border-radius:8px;margin-bottom:20px}.contact-info p{margin-bottom:15px}.contact-info p:last-child{margin-bottom:0}footer{background:var(--dark);color:var(--white);text-align:center;padding:20px;font-size:.9rem;margin-top:auto}
@media(max-width:768px){.nav-container{flex-direction:row;flex-wrap:wrap;padding:10px 16px}.logo{font-size:1.05rem;max-width:calc(100% - 60px)}.menu-toggle{display:block;margin-left:auto}nav{order:3;display:flex;flex-direction:column;align-items:stretch;width:100%;max-height:0;overflow:hidden;gap:0;transition:max-height .3s ease}nav.open{max-height:360px}nav a{padding:11px 8px;border-top:1px solid rgba(74,107,108,.12)}.menu-toggle.active span:nth-child(1){transform:translateY(8px) rotate(45deg)}.menu-toggle.active span:nth-child(2){opacity:0}.menu-toggle.active span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}.section{padding:34px 16px}.section h2{font-size:1.55rem;margin-bottom:22px}.card{padding:22px 18px}.contact-info{font-size:1rem}.contact-info img{margin-bottom:16px}footer{padding:18px 16px}}@media(max-width:420px){.logo{font-size:1rem}.section h2{font-size:1.4rem}}
</style></head>
<body><header><div class="nav-container"><a href="index.html" class="logo">Małgorzata Rzewuska</a><button class="menu-toggle" type="button" aria-label="Otwórz menu" aria-expanded="false" aria-controls="main-nav"><span></span><span></span><span></span></button><nav id="main-nav"><a href="index.html">Strona główna</a><a href="o-terapii.html">O terapii</a><a href="wskazania.html">Wskazania</a><a href="cennik.html">Cennik</a><a href="o-mnie.html">O mnie</a><a href="kontakt.html" class="active">Kontakt</a></nav></div></header>
<main><section class="section"><h2>Kontakt</h2><div class="card contact-info" style="max-width:600px;margin:0 auto"><img src="zdjecie-gabinet.jpg" alt="Gabinet Terapii Czaszkowo-Krzyżowej w Gdyni"><p><strong>Małgorzata Rzewuska</strong></p><p>Gabinet Terapii Czaszkowo-Krzyżowej, Gdynia</p><p>Telefon: +48 000 000 000</p><p>E-mail: kontakt@example.pl</p></div></section></main>
<footer><p>&copy; 2026 Małgorzata Rzewuska - Terapia Czaszkowo-Krzyżowa Gdynia. Wszelkie prawa zastrzeżone.</p></footer>
<script>const toggle=document.querySelector('.menu-toggle'),nav=document.querySelector('#main-nav');toggle.addEventListener('click',()=>{const open=nav.classList.toggle('open');toggle.classList.toggle('active',open);toggle.setAttribute('aria-expanded',String(open));toggle.setAttribute('aria-label',open?'Zamknij menu':'Otwórz menu');});nav.querySelectorAll('a').forEach(link=>link.addEventListener('click',()=>{nav.classList.remove('open');toggle.classList.remove('active');toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','Otwórz menu');}));</script></body></html>
